plugins { id 'com.android.application' }
android {
    namespace 'cn.shore.ledger'
    compileSdk 35
    defaultConfig { applicationId 'cn.shore.ledger'; minSdk 26; targetSdk 34; versionCode 3; versionName '2.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (rootProject.file('private-signing/shore-release.p12').exists()) {
            release {
                storeFile rootProject.file('private-signing/shore-release.p12')
                storePassword rootProject.file('private-signing/store-password.txt').text.trim()
                keyAlias 'shore'
                keyPassword rootProject.file('private-signing/store-password.txt').text.trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file('private-signing/shore-release.p12').exists()) signingConfig signingConfigs.release
        }
    }
}
